name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile \
            src/agents/tools.py \
            src/agents/graph.py \
            src/agents/state.py \
            api/replay/api.py \
            tests/test_api_endpoints.py \
            tests/test_api_validation.py \
            tests/test_tools_scoring.py \
            tests/test_graph_windowing.py

      - name: Run tests
        run: |
          pytest -q
